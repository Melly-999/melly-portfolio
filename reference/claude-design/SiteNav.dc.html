<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<nav aria-label="Main" style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,40px);background:rgba(10,14,23,0.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #161d30;font-family:'JetBrains Mono',ui-monospace,monospace;">
  <a href="index.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0;">
    <span style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,#f7933c,#e8623a);color:#0a0e17;font-weight:800;font-size:15px;letter-spacing:-0.02em;box-shadow:0 0 24px -6px rgba(247,147,60,0.6);">MO</span>
    <span style="display:flex;flex-direction:column;line-height:1.1;">
      <span style="font-weight:700;font-size:13px;color:#eef1f8;letter-spacing:0.01em;">Mateusz Ozimkiewicz</span>
      <span style="font-weight:500;font-size:10px;color:#6f7a93;letter-spacing:0.14em;text-transform:uppercase;">Full-Stack · AI Tools</span>
    </span>
  </a>
  <div style="display:flex;align-items:center;gap:4px;overflow-x:auto;">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" style="{{ l.style }}" style-hover="color:#eef1f8;background:rgba(247,147,60,0.08);">{{ l.label }}</a>
    </sc-for>
    <a href="Contact.dc.html" style="margin-left:8px;flex-shrink:0;display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:999px;background:linear-gradient(145deg,#f7933c,#e8623a);color:#0a0e17;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:0.02em;box-shadow:0 8px 24px -12px rgba(247,147,60,0.8);" style-hover="filter:brightness(1.08);">Contact</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;projects&quot;,&quot;about&quot;,&quot;contact&quot;,&quot;tokens&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const base = "flex-shrink:0;padding:11px 13px;border-radius:8px;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:0.01em;transition:all .15s;white-space:nowrap;";
    const items = [
      { key: 'home', label: 'Home', href: 'index.dc.html' },
      { key: 'projects', label: 'Projects', href: 'Projects.dc.html' },
      { key: 'about', label: 'About', href: 'About.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' },
      { key: 'tokens', label: 'Design System', href: 'DesignTokens.dc.html' },
    ];
    return {
      links: items.map(it => ({
        ...it,
        style: base + (it.key === active
          ? 'color:#f7933c;background:rgba(247,147,60,0.1);'
          : 'color:#aab2c6;background:transparent;'),
      })),
    };
  }
}
</script>
</body>
</html>
