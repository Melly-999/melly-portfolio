<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  a:focus-visible,button:focus-visible{outline:2px solid #f7933c;outline-offset:2px;border-radius:8px;}
</style>
</helmet>
<nav ref="{{ navRef }}" aria-label="Main" style="position:sticky;top:0;z-index:50;background:rgba(10,14,23,0.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #161d30;font-family:'JetBrains Mono',ui-monospace,monospace;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(16px,4vw,40px);min-height:56px;">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0;min-width:0;">
      <span style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,#f7933c,#e8623a);color:#0a0e17;font-weight:800;font-size:15px;letter-spacing:-0.02em;box-shadow:0 0 24px -6px rgba(247,147,60,0.6);">MO</span>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex;flex-direction:column;line-height:1.1;">
          <span style="font-weight:700;font-size:13px;color:#eef1f8;letter-spacing:0.01em;">Mateusz Ozimkiewicz</span>
          <span style="font-weight:500;font-size:10px;color:#6f7a93;letter-spacing:0.14em;text-transform:uppercase;">Full-Stack Developer</span>
        </span>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <span style="font-weight:700;font-size:14px;color:#eef1f8;">Mateusz</span>
      </sc-if>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:4px;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="{{ l.style }}" style-hover="color:#eef1f8;background:rgba(247,147,60,0.08);">{{ l.label }}</a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-expanded="{{ menuOpen }}" aria-controls="mo-mobile-menu" onClick="{{ toggleMenu }}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #2a3652;background:rgba(14,19,32,0.7);color:#eef1f8;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:13px;cursor:pointer;">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
    <div id="mo-mobile-menu" style="border-top:1px solid #161d30;background:rgba(10,14,23,0.97);padding:8px clamp(16px,4vw,40px) 16px;display:flex;flex-direction:column;gap:4px;">
      <sc-for list="{{ links }}" as="m" hint-placeholder-count="5">
        <a href="{{ m.href }}" onClick="{{ closeMenu }}" style="{{ m.mobileStyle }}" style-hover="background:rgba(247,147,60,0.08);color:#eef1f8;">{{ m.label }}</a>
      </sc-for>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;projects&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, width: 1200 };
  navRef = React.createRef();
  componentDidMount() {
    this._ro = new ResizeObserver((entries) => {
      const w = Math.round(entries[0].contentRect.width);
      if (Math.abs(w - this.state.width) > 1) this.setState({ width: w });
    });
    if (this.navRef.current) this._ro.observe(this.navRef.current);
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    window.addEventListener('keydown', this._onKey);
    this._onW = (e) => this.setState({ width: e.detail });
    window.addEventListener('dc-set-width', this._onW);
  }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); window.removeEventListener('keydown', this._onKey); window.removeEventListener('dc-set-width', this._onW); }
  renderVals() {
    const isMobile = this.state.width < 720;
    const active = this.props.active || 'home';
    const base = 'flex-shrink:0;padding:11px 13px;border-radius:8px;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:0.01em;transition:all .15s;white-space:nowrap;';
    const mobileBase = 'display:flex;align-items:center;min-height:48px;padding:0 14px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;';
    const items = [
      { key: 'home', label: 'Home', href: 'index.dc.html' },
      { key: 'projects', label: 'Projects', href: 'Projects.dc.html' },
      { key: 'about', label: 'About', href: 'About.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' },
      { key: 'github', label: 'GitHub ↗', href: 'https://github.com/Melly-999' },
    ];
    const links = items.map(it => ({
      ...it,
      style: base + (it.key === active ? 'color:#f7933c;background:rgba(247,147,60,0.1);' : 'color:#aab2c6;background:transparent;'),
      mobileStyle: mobileBase + (it.key === active ? 'color:#f7933c;background:rgba(247,147,60,0.1);' : 'color:#aab2c6;'),
    }));
    return {
      navRef: this.navRef,
      isDesktop: !isMobile,
      isMobile,
      links,
      menuOpen: this.state.menuOpen,
      showMenu: isMobile && this.state.menuOpen,
      menuLabel: this.state.menuOpen ? 'Close ✕' : 'Menu ☰',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
